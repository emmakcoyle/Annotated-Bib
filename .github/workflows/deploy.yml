name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - v5
  schedule:
    # Rebuilds every 8 hours so new notes go live on their own,
    # without a manual push. This only picks up new/changed
    # *content* files (new .md notes) — plugin code changes still
    # need `npx quartz plugin install --latest` run locally, with
    # the updated quartz.lock.json committed and pushed, since the
    # plugin cache below is keyed to that lockfile's hash and the
    # `quartz plugin install` step (no --latest flag) always
    # installs exactly what's pinned there, not whatever is newest
    # on GitHub.
    - cron: "0 */8 * * *"
  workflow_dispatch:
    # Lets you trigger a rebuild manually from the Actions tab in
    # GitHub, useful for testing without waiting for the schedule
    # or making a dummy commit.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Cache Quartz plugins
        uses: actions/cache@v5
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-plugins-${{ hashFiles('quartz.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-plugins-
      - name: Install Dependencies
        run: npm ci
      - name: Install Quartz plugins
        run: npx quartz plugin install
      - name: Build Quartz
        run: npx quartz build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4